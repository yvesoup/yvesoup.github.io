name: Deploy to GitHub Pages

on:
  # Rebuild and redeploy the site every time you push to `main`
  push:
    branches: [main]
  # Also lets you run this workflow by hand from the Actions tab
  workflow_dispatch:

# Allow this workflow to read the repo and publish to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@v7
      - name: Install, build, and upload your site
        uses: withastro/action@v6
        with:
          node-version: 24

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
